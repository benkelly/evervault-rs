name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: evervault-rs

jobs:
  create-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false

  build-release:
    name: Build ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          - target: x86_64-apple-darwin
            os: macos-13
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p .cargo
          {
            echo '[target.aarch64-unknown-linux-gnu]'
            echo 'linker = "aarch64-linux-gnu-gcc"'
          } >> .cargo/config.toml

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.create-release.outputs.version }}"
          stage="${BIN_NAME}-${version}-${{ matrix.target }}"
          mkdir -p "dist/${stage}"
          cp "target/${{ matrix.target }}/release/${BIN_NAME}" "dist/${stage}/"
          cp README.md LICENSE* "dist/${stage}/" 2>/dev/null || true
          tar -C dist -czf "dist/${stage}.tar.gz" "${stage}"
          (cd dist && shasum -a 256 "${stage}.tar.gz" > "${stage}.tar.gz.sha256")
          echo "ASSET=dist/${stage}.tar.gz" >> "$GITHUB_ENV"
          echo "CHECKSUM=dist/${stage}.tar.gz.sha256" >> "$GITHUB_ENV"

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ needs.create-release.outputs.version }}"
          $stage = "$env:BIN_NAME-$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$stage" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/$env:BIN_NAME.exe" "dist/$stage/"
          if (Test-Path README.md) { Copy-Item README.md "dist/$stage/" }
          Compress-Archive -Path "dist/$stage" -DestinationPath "dist/$stage.zip"
          $hash = (Get-FileHash "dist/$stage.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $stage.zip" | Out-File -Encoding ascii "dist/$stage.zip.sha256"
          "ASSET=dist/$stage.zip" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CHECKSUM=dist/$stage.zip.sha256" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            ${{ env.ASSET }}
            ${{ env.CHECKSUM }}

  publish-crate:
    name: Publish to crates.io
    needs: [create-release, build-release]
    runs-on: ubuntu-latest
    if: ${{ vars.PUBLISH_CRATE == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  homebrew:
    name: Update Homebrew formula
    needs: [create-release, build-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.HOMEBREW_TAP_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Wait briefly for release assets
        run: sleep 15

      - name: Compute checksums
        id: checksums
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          base="https://github.com/${REPO}/releases/download/v${VERSION}"
          declare -A targets=(
            [darwin_arm64]="${BIN_NAME}-${VERSION}-aarch64-apple-darwin.tar.gz"
            [darwin_x86_64]="${BIN_NAME}-${VERSION}-x86_64-apple-darwin.tar.gz"
            [linux_arm64]="${BIN_NAME}-${VERSION}-aarch64-unknown-linux-gnu.tar.gz"
            [linux_x86_64]="${BIN_NAME}-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          )
          mkdir -p .tmp
          for key in "${!targets[@]}"; do
            file="${targets[$key]}"
            curl -fsSL "${base}/${file}" -o ".tmp/${file}"
            sha=$(sha256sum ".tmp/${file}" | awk '{print $1}')
            echo "${key}=${sha}" >> "$GITHUB_OUTPUT"
            echo "url_${key}=${base}/${file}" >> "$GITHUB_OUTPUT"
          done

      - name: Render formulae
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
          REPO: ${{ github.repository }}
          DARWIN_ARM64_SHA: ${{ steps.checksums.outputs.darwin_arm64 }}
          DARWIN_X86_64_SHA: ${{ steps.checksums.outputs.darwin_x86_64 }}
          LINUX_ARM64_SHA: ${{ steps.checksums.outputs.linux_arm64 }}
          LINUX_X86_64_SHA: ${{ steps.checksums.outputs.linux_x86_64 }}
        run: |
          set -euo pipefail
          mkdir -p Formula
          tmpl=".github/homebrew/evervault-rs.rb.tmpl"

          # Versioned formula (e.g. evervault-rs@0.1.0.rb)
          class_versioned="EvervaultRsAT$(echo "${VERSION}" | tr '.' '')"
          out_versioned="Formula/${BIN_NAME}@${VERSION}.rb"
          CLASS_NAME="${class_versioned}" \
          FORMULA_VERSION="${VERSION}" \
            envsubst < "${tmpl}" > "${out_versioned}"

          # Latest formula (always points to most recent release)
          out_latest="Formula/${BIN_NAME}.rb"
          CLASS_NAME="EvervaultRs" \
          FORMULA_VERSION="${VERSION}" \
            envsubst < "${tmpl}" > "${out_latest}"

      - name: Commit formula updates
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/
          if git diff --cached --quiet; then
            echo "No formula changes to commit."
            exit 0
          fi
          git commit -m "homebrew: bump ${BIN_NAME} to v${{ needs.create-release.outputs.version }}"
          git push origin HEAD:main
