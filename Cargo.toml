[package]
name = "evervault-rs"
version = "0.1.0"
edition = "2021"
description = "A Rust CLI demo that encrypts and decrypts sensitive fields via the Evervault REST API"
license = "MIT"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
dotenv = "0.15"
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
